<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; }
  #fig { position: relative; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #fig svg { width: 100%; height: auto; display: block; }
  .dimedit { position: absolute; width: 98px; font: 600 16px system-ui, Arial, sans-serif; padding: 7px 6px;
             border: 2px solid #33415C; border-radius: 4px; background: #FFF7CF; color: #0B3D91; z-index: 4;
             box-shadow: 0 3px 10px rgba(0, 0, 0, .3); }
  /* fenêtre d'un objet (groupe de boulons, pièce, efforts) : ses paramètres */
  .popover { position: absolute; z-index: 5; background: #fff; border: 2px solid #33415C; border-radius: 6px;
             padding: 8px 10px 8px; box-shadow: 0 4px 14px rgba(0, 0, 0, .28); min-width: 240px; font-size: 13px; color: #15181F; }
  .popover h4 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: #33415C; letter-spacing: .02em; }
  .popover .rows.deux { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .popover .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 3px 0; }
  .popover label { flex: 1 1 auto; color: #374151; white-space: nowrap; }
  .popover input, .popover select { width: 82px; font: 600 14px system-ui, Arial, sans-serif; padding: 4px 5px;
             border: 1.5px solid #C9B95A; border-radius: 4px; background: #FFF7CF; color: #0B3D91; box-sizing: border-box; }
  .popover select { width: auto; min-width: 82px; max-width: 175px; }
  .popover input:disabled, .popover select:disabled { background: #EEF0F3; border-color: #C6CBD3; color: #6E7480; }
  .popover .btns { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
  .popover button { font: 600 12px system-ui, Arial, sans-serif; padding: 4px 10px; border-radius: 4px; cursor: pointer;
             border: 1px solid #33415C; background: #fff; color: #33415C; }
  .popover button.ok { background: #33415C; color: #fff; }
  .bulle { position: absolute; z-index: 6; pointer-events: none; font: 600 14px system-ui, Arial, sans-serif;
           padding: 4px 8px; border-radius: 4px; background: #15181F; color: #fff; opacity: .92; }
</style>
</head>
<body>
<div id="fig" role="figure"></div>
<script>
(function () {
  'use strict';
  var args = null, seq = 0;
  function send(type, data) {
    var m = { isStreamlitMessage: true, type: type };
    for (var k in data) m[k] = data[k];
    window.parent.postMessage(m, '*');
  }
  function fig() { return document.getElementById('fig'); }
  function hauteur() {
    var h = fig().getBoundingClientRect().height;
    send('streamlit:setFrameHeight', { height: Math.ceil(h) + 6 });
  }
  /* un seul message vers Python : les clés modifiées et leurs nouvelles valeurs */
  function envoyer(changes, sym) {
    if (!changes || !Object.keys(changes).length) return;
    seq += 1;
    send('streamlit:setComponentValue', { value: { changes: changes, sym: sym || '', seq: seq, t: Date.now() }, dataType: 'json' });
  }
  function valeur(key) {
    var v = (args && args.valeurs) ? args.valeurs[key] : null;
    return (v === null || v === undefined) ? '' : v;
  }
  function fermerTout() {
    fig().querySelectorAll('.dimedit, .popover').forEach(function (e) { e.remove(); });
    fig().style.minHeight = '';
  }
  /* --- édition d'une cote sur place : Entrée valide, Échap annule, la perte de focus valide */
  function commit(inp, ok) {
    if (inp._fait) return;
    inp._fait = true;
    var v = inp.value, key = inp._key, sym = inp._sym, old = inp._old;
    inp.remove();
    if (!ok || v === '' || !isFinite(parseFloat(v))) return;
    if (old !== null && old !== undefined && old !== '' && parseFloat(v) === parseFloat(old)) return;
    var ch = {}; ch[key] = parseFloat(v);
    envoyer(ch, sym);
  }
  function ouvrir(g) {
    var f = fig(), key = g.getAttribute('data-key'), sym = g.getAttribute('data-sym');
    if (!key) return;
    fermerTout();
    var r = g.getBoundingClientRect(), fr = f.getBoundingClientRect();
    var inp = document.createElement('input');
    inp.type = 'number'; inp.step = 'any'; inp.setAttribute('inputmode', 'decimal'); inp.className = 'dimedit';
    inp.setAttribute('aria-label', 'Nouvelle valeur de ' + sym + ' en mm');
    inp.value = valeur(key);
    inp._key = key; inp._sym = sym; inp._old = inp.value;
    inp.style.left = Math.max(2, Math.min(f.scrollWidth - 102, r.left - fr.left + f.scrollLeft + r.width / 2 - 49)) + 'px';
    inp.style.top = Math.max(2, Math.min(f.scrollHeight - 44, r.top - fr.top + f.scrollTop + r.height / 2 - 20)) + 'px';
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); commit(inp, true); }
      else if (e.key === 'Escape') { e.preventDefault(); commit(inp, false); }
    });
    inp.addEventListener('blur', function () { commit(inp, true); });
    f.appendChild(inp);
    inp.focus();
    inp.select();
  }
  /* --- poignée + / − : « clé:delta » → nombre de rangées ± 1, jamais moins de 1 */
  function action(g) {
    var a = (g.getAttribute('data-action') || '').split(':');
    if (a.length !== 2) return;
    var key = a[0], delta = parseInt(a[1], 10), cur = parseFloat(valeur(key));
    if (!isFinite(cur)) cur = 1;
    var nv = Math.max(1, Math.round(cur + delta));
    if (nv === cur) return;
    fermerTout();
    var ch = {}; ch[key] = nv;
    envoyer(ch, key);
  }
  /* --- fenêtre d'un objet : groupe de boulons, pièce, efforts
         (définition reçue de Python : args.groupes[grp]) */
  function ouvrirGroupe(g) {
    var grp = g.getAttribute('data-group'), def = (args && args.groupes) ? args.groupes[grp] : null;
    if (!def) return;
    if (g._fin_drag && Date.now() - g._fin_drag < 400) return;   /* fin de glissement, pas un clic */
    var f = fig();
    fermerTout();
    g.classList.add('sel');
    var pop = document.createElement('form');
    pop.className = 'popover';
    pop.setAttribute('aria-label', def.titre || ('Groupe ' + grp));
    var h = document.createElement('h4'); h.textContent = def.titre || ('Groupe ' + grp); pop.appendChild(h);
    var champs = def.champs || [], inputs = [];
    var rows = document.createElement('div');
    rows.className = 'rows' + (champs.length > 5 ? ' deux' : '');
    pop.appendChild(rows);
    champs.forEach(function (c) {
      var row = document.createElement('div'); row.className = 'row';
      var lab = document.createElement('label'); lab.textContent = c.lab; row.appendChild(lab);
      var w;
      if (c.type === 's') {
        w = document.createElement('select');
        (c.options || []).forEach(function (o) {
          var op = document.createElement('option'); op.value = o; op.textContent = o; w.appendChild(op);
        });
        w.value = String(valeur(c.key));
      } else {
        w = document.createElement('input'); w.type = 'number'; w.step = c.step || 'any';
        w.setAttribute('inputmode', 'decimal'); w.value = valeur(c.key);
      }
      if (c.dis) w.disabled = true;
      w.setAttribute('aria-label', c.lab); w._key = c.key; w._old = String(w.value); w._type = c.type;
      row.appendChild(w); rows.appendChild(row); inputs.push(w);
    });
    if (def.note) {
      var nt = document.createElement('div');
      nt.style.cssText = 'font-size:11px;color:#6E7480;margin-top:4px;max-width:340px;';
      nt.textContent = def.note; pop.appendChild(nt);
    }
    var btns = document.createElement('div'); btns.className = 'btns';
    var bAnn = document.createElement('button'); bAnn.type = 'button'; bAnn.textContent = 'Annuler';
    var bOk = document.createElement('button'); bOk.type = 'submit'; bOk.className = 'ok'; bOk.textContent = 'Valider';
    btns.appendChild(bAnn); btns.appendChild(bOk); pop.appendChild(btns);
    function fermer() { pop.remove(); g.classList.remove('sel'); f.style.minHeight = ''; hauteur(); }
    bAnn.addEventListener('click', fermer);
    pop.addEventListener('submit', function (e) {
      e.preventDefault();
      var ch = {};
      inputs.forEach(function (w) {
        var v = String(w.value);
        if (v === w._old) return;
        if (w._type === 's') ch[w._key] = v;
        else if (v !== '' && isFinite(parseFloat(v))) ch[w._key] = parseFloat(v);
      });
      fermer();
      envoyer(ch, 'groupe ' + grp);
    });
    pop.addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.preventDefault(); fermer(); } });
    f.appendChild(pop);
    /* placement : à droite de l'étiquette, sans sortir du cadre */
    var r = g.getBoundingClientRect(), fr = f.getBoundingClientRect();
    var pw = pop.offsetWidth, ph = pop.offsetHeight;
    if (ph + 8 > f.clientHeight) { f.style.minHeight = (ph + 8) + 'px'; hauteur(); }
    var left = r.left - fr.left + f.scrollLeft + r.width + 10;
    if (left + pw > f.clientWidth + f.scrollLeft - 2) left = Math.max(2, r.left - fr.left + f.scrollLeft - pw - 10);
    var top = r.top - fr.top + f.scrollTop - 8;
    top = Math.max(2, Math.min(top, Math.max(2, f.clientHeight - ph - 4)));
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
    if (inputs.length) { inputs[0].focus(); if (inputs[0].select) inputs[0].select(); }
  }
  function lier(sel, fn) {
    fig().querySelectorAll(sel).forEach(function (g) {
      g.addEventListener('click', function (e) { e.stopPropagation(); fn(g); });
      g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(g); } });
    });
  }
  /* --- glissement d'une pièce : « data-drag » = cote pilotée par le
         déplacement horizontal (jeu gh), « data-drag2 » = cote pilotée par
         le déplacement vertical (décalage Δz) */
  function glisser(g) {
    var kx = g.getAttribute('data-drag'), sx = g.getAttribute('data-dsym') || kx;
    var ky = g.getAttribute('data-drag2'), sy = g.getAttribute('data-dsym2') || ky;
    g.addEventListener('pointerdown', function (e) {
      if (e.button) return;
      var f = fig(), svg = g.ownerSVGElement;
      var vb = svg.viewBox.baseVal, echelle = vb.width / svg.getBoundingClientRect().width;
      var x0 = e.clientX, y0 = e.clientY, bouge = false, bulle = null;
      var vx = parseFloat(valeur(kx)); if (!isFinite(vx)) vx = 0;
      var vy = ky ? parseFloat(valeur(ky)) : 0; if (!isFinite(vy)) vy = 0;
      function nx(ev) { return Math.max(0, Math.round(vx + (ev.clientX - x0) * echelle)); }
      function ny(ev) { return ky ? Math.max(0, Math.round(vy + (ev.clientY - y0) * echelle)) : vy; }
      function move(ev) {
        if (!bouge && Math.abs(ev.clientX - x0) + Math.abs(ev.clientY - y0) < 5) return;
        if (!bouge) {
          bouge = true; g.classList.add('drag'); fermerTout();
          bulle = document.createElement('div'); bulle.className = 'bulle'; f.appendChild(bulle);
        }
        g.setAttribute('transform', 'translate(' + (nx(ev) - vx) + ' ' + (ny(ev) - vy) + ')');
        bulle.textContent = sx + ' = ' + nx(ev) + (ky ? ' · ' + sy + ' = ' + ny(ev) : '') + ' mm';
        var fr = f.getBoundingClientRect();
        bulle.style.left = (ev.clientX - fr.left + f.scrollLeft + 14) + 'px';
        bulle.style.top = (ev.clientY - fr.top + f.scrollTop - 36) + 'px';
        ev.preventDefault();
      }
      function up(ev) {
        window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
        if (bulle) bulle.remove();
        g.classList.remove('drag');
        if (bouge) {
          g._fin_drag = Date.now();
          g.removeAttribute('transform');
          var ch = {}, s = [];
          if (nx(ev) !== vx) { ch[kx] = nx(ev); s.push(sx); }
          if (ky && ny(ev) !== vy) { ch[ky] = ny(ev); s.push(sy); }
          envoyer(ch, s.join(' · '));
        }
      }
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
    });
  }
  function rendre(a) {
    args = a;
    var f = fig(), garde = f.scrollLeft;
    f.innerHTML = a.svg || '';
    f.style.minHeight = '';
    f.scrollLeft = garde;
    lier('g.ed[data-key]', ouvrir);
    lier('g.ed[data-action]', action);
    lier('g.ed[data-group]', ouvrirGroupe);
    f.querySelectorAll('g.ed[data-drag]').forEach(glisser);
    /* centrer la vue sur la première cote en alerte si elle est hors champ */
    var chaud = f.querySelector('.dm.hot .dl') || f.querySelector('.hot');
    if (chaud && f.scrollWidth > f.clientWidth + 4) {
      var rc = chaud.getBoundingClientRect(), rf = f.getBoundingClientRect();
      if (rc.left < rf.left + 8 || rc.right > rf.right - 8) f.scrollLeft += rc.left + rc.width / 2 - (rf.left + rf.width / 2);
    }
    hauteur();
    setTimeout(hauteur, 50);
  }
  /* un clic hors de la fenêtre de groupe la referme sans rien envoyer */
  document.addEventListener('mousedown', function (e) {
    var pop = fig().querySelector('.popover');
    if (pop && !pop.contains(e.target)) { pop.remove(); fig().style.minHeight = ''; hauteur(); }
  });
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'streamlit:render') return;
    rendre(d.args || {});
  });
  window.addEventListener('resize', hauteur);
  send('streamlit:componentReady', { apiVersion: 1 });
})();
</script>
</body>
</html>
